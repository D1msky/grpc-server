version: "3"

# RoadRunner configuration for gRPC server

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php worker.php"
  relay: pipes

grpc:
  listen: tcp://0.0.0.0:9001
  proto:
    - "proto/package_delivery.proto"

  # Max workers
  pool:
    num_workers: 4
    max_jobs: 0
    allocate_timeout: 60s
    destroy_timeout: 60s

logs:
  mode: development
  level: debug
  encoding: console
  output: stdout
  err_output: stderr

# Health check endpoint
status:
  address: 127.0.0.1:2114

# Metrics endpoint
metrics:
  address: 127.0.0.1:2112
